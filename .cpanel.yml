---
# cPanel Git Version Control deployment.
#
# The repo root IS the theme, so these tasks copy the root into
# wp-content/themes/awaqi, excluding the development files that should never
# reach a web server.
#
# Not needed if you deploy with the "Deployer for Git" WordPress plugin —
# that installs straight from GitHub. This is the fallback / alternative path.
#
# CHECK WP_ROOT BELOW before deploying. It must point at the folder containing
# wp-config.php. Confirm it under cPanel → Domains → Document Root.

deployment:
  tasks:
    - export WP_ROOT="$HOME/public_html"
    - export THEMES="$WP_ROOT/wp-content/themes"
    - export THEME="$THEMES/awaqi"

    # Refuse to deploy into a path WordPress does not actually read.
    - test -f "$WP_ROOT/wp-config.php" || { echo "ERROR: no wp-config.php in $WP_ROOT — fix WP_ROOT in .cpanel.yml"; exit 1; }
    - mkdir -p "$THEMES"

    # If something else already occupies the folder, back it up once rather
    # than overwriting it. Skipped when the folder is already our theme.
    - if [ -f "$THEME/style.css" ] && ! grep -q "Theme Name: Awaqi" "$THEME/style.css"; then mv "$THEME" "$THEME-backup-$(date +%Y%m%d%H%M%S)"; echo "Backed up the previous theme folder"; fi

    - mkdir -p "$THEME"

    # rsync mirrors (removing files deleted from the repo) where available;
    # cp is the fallback for hosts that do not ship rsync.
    - if command -v rsync >/dev/null 2>&1; then rsync -a --delete --exclude='.git' --exclude='.github' --exclude='.gitignore' --exclude='.cpanel.yml' --exclude='deploy.php' --exclude='composer.json' --exclude='composer.lock' --exclude='README.md' --exclude='SKILL.md' --exclude='docs' --exclude='tools' --exclude='raw-3d' --exclude='vendor' --exclude='node_modules' ./ "$THEME/"; else cp -R . "$THEME/" && rm -rf "$THEME/.git" "$THEME/docs" "$THEME/tools" "$THEME/raw-3d" "$THEME/deploy.php" "$THEME/README.md" "$THEME/SKILL.md" "$THEME/composer.json"; fi

    - echo "Deployed to $THEME"
    - ls -la "$THEME"
